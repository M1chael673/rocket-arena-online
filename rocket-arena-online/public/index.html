<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rocket Arena Online</title><style>*{box-sizing:border-box}body{margin:0;background:#090e20;color:white;font-family:system-ui,Arial;text-align:center}main{max-width:1000px;margin:auto;padding:18px}h1{color:#60f3ee;letter-spacing:3px}button,input{padding:13px;border:0;border-radius:9px;font-size:16px}button{background:#57f2e9;color:#071521;font-weight:800;cursor:pointer;margin:5px}input{background:#202b48;color:white;width:140px;text-transform:uppercase}canvas{width:100%;border:3px solid #4b6384;border-radius:12px;background:#153b37;display:block;touch-action:none}#status{min-height:30px;color:#f9d56b}#hud{display:flex;justify-content:space-around;font-weight:800;font-size:21px;margin:12px}.mobile{display:none}.mobile button{min-width:60px;touch-action:none}@media(pointer:coarse){.mobile{display:block}}small{color:#b5c4db}</style></head><body><main><h1>ROCKET ARENA ONLINE</h1><div id="lobby"><button id="create">Lobby erstellen</button><input id="code" maxlength="5" placeholder="CODE"><button id="join">Beitreten</button></div><p id="status">Erstelle eine Lobby oder tritt mit einem Code bei.</p><div id="hud"><span id="blue">BLAU 0</span><span id="clock">2:00</span><span id="orange">0 ORANGE</span></div><canvas id="field" width="900" height="520"></canvas><div><button id="restart" style="display:none">Neues Match</button></div><p><small>D: Vorwärts · A: Rückwärts · W: Links · S: Rechts · Leertaste: Boost. Handy: Tasten unten.</small></p><div class="mobile"><div><button data-key="up">▲ GAS</button><button data-key="boost">⚡ BOOST</button></div><div><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div></div></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let ws,id=-1,game=null,visual=null,keys={up:false,down:false,left:false,right:false,boost:false},connected=false;
function connect(action,code){if(ws)ws.close();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);status.textContent='Verbinde ...';ws.onopen=()=>ws.send(JSON.stringify({type:action,code}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){id=m.id;connected=true;status.textContent='Lobby '+m.code+' – '+(id===0?'Du bist BLAU. Warte auf deinen Freund!':'Du bist ORANGE.');document.querySelector('#lobby').style.display='none'}if(m.type==='start'){visual=null;status.textContent='MATCH LÄUFT – Lobby '+m.code;document.querySelector('#restart').style.display='none'}if(m.type==='state'){game=m.game;if(!visual)visual=JSON.parse(JSON.stringify(game));update()}if(m.type==='goal'){status.textContent=(m.scorer===id?'TOR!':'GEGENTOR!')+' Spiel geht weiter ...'}if(m.type==='end'){status.textContent='SPIELENDE! '+(m.score[id]>m.score[1-id]?'DU HAST GEWONNEN!':m.score[id]===m.score[1-id]?'UNENTSCHIEDEN':'DU HAST VERLOREN');document.querySelector('#restart').style.display='inline-block'}if(m.type==='opponentLeft'){status.textContent='Gegner hat die Lobby verlassen. Lade die Seite neu.';document.querySelector('#restart').style.display='none'}if(m.type==='error'){status.textContent=m.message;document.querySelector('#lobby').style.display='block'}};ws.onclose=()=>{connected=false;status.textContent='Verbindung getrennt. Seite neu laden, um erneut zu spielen.'};ws.onerror=()=>{status.textContent='Server nicht erreichbar.'}}
document.querySelector('#create').onclick=()=>connect('create');document.querySelector('#join').onclick=()=>connect('join',document.querySelector('#code').value);document.querySelector('#restart').onclick=()=>ws?.send(JSON.stringify({type:'restart'}));
function update(){document.querySelector('#blue').textContent='BLAU '+game.score[0];document.querySelector('#orange').textContent=game.score[1]+' ORANGE';let s=Math.ceil(game.time);document.querySelector('#clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function car(c,color){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle='#090e18';ctx.fillRect(-22,-20,44,40);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-26,-14,52,28,8);ctx.fill();ctx.fillStyle='#a9e5ef';ctx.fillRect(0,-10,12,20);ctx.fillStyle='#fff';ctx.fillRect(20,-11,5,7);ctx.fillRect(20,4,5,7);ctx.restore()}
function draw(){ctx.fillStyle='#173b35';ctx.fillRect(0,0,900,520);for(let x=0;x<900;x+=100){ctx.fillStyle=(x/100)%2?'#ffffff06':'#0000000a';ctx.fillRect(x,0,100,520)}ctx.strokeStyle='#c3fff1aa';ctx.lineWidth=4;ctx.strokeRect(18,18,864,484);ctx.beginPath();ctx.moveTo(450,18);ctx.lineTo(450,502);ctx.stroke();ctx.beginPath();ctx.arc(450,260,90,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#4d9cff';ctx.fillRect(0,185,22,150);ctx.fillStyle='#ff9b44';ctx.fillRect(878,185,22,150);if(game){if(!visual)visual=JSON.parse(JSON.stringify(game));for(let i=0;i<2;i++){let v=visual.cars[i],target=game.cars[i];v.x+=(target.x-v.x)*.25;v.y+=(target.y-v.y)*.25;let da=Math.atan2(Math.sin(target.a-v.a),Math.cos(target.a-v.a));v.a+=da*.25}visual.ball.x+=(game.ball.x-visual.ball.x)*.27;visual.ball.y+=(game.ball.y-visual.ball.y)*.27;car(visual.cars[0],'#35baff');car(visual.cars[1],'#ff953f');ctx.shadowColor='white';ctx.shadowBlur=20;ctx.fillStyle='white';ctx.beginPath();ctx.arc(visual.ball.x,visual.ball.y,19,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#333';ctx.beginPath();ctx.arc(visual.ball.x,visual.ball.y,7,0,7);ctx.fill()}else{ctx.fillStyle='#fff';ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.fillText('WARTE AUF SPIELER',450,260)}requestAnimationFrame(draw)}draw();
const map={KeyD:'up',ArrowUp:'up',KeyA:'down',ArrowDown:'down',KeyW:'left',ArrowLeft:'left',KeyS:'right',ArrowRight:'right',Space:'boost'};window.addEventListener('keydown',e=>{if(map[e.code]){e.preventDefault();keys[map[e.code]]=true}});window.addEventListener('keyup',e=>{if(map[e.code]){e.preventDefault();keys[map[e.code]]=false}});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false});setInterval(()=>{if(connected&&ws?.readyState===1)ws.send(JSON.stringify({type:'input',...keys}))},33);
</script></body></html>
